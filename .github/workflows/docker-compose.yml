name: Build and push Docker Images
on: 
    push:
        branches: 
                - main

jobs:
    docker: 
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
            
            - name: Login to DockerHub
              uses: docker/login-action@v3
              with:
                username: ${{secrets.DOCKERHUB_USERNAME}}
                password: ${{secrets.DOCKERHUB_TOKEN}}
            
            - name: Setup Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build and push Client
              uses: docker/build-push-action@v6
              with:
                    context: ./client
                    push: true
                    build-args: |
                            VITE_CLERK_PUBLISHABLE_KEY=${{secrets.CLIENT_VITE_CLERK_PUBLISHABLE_KEY}}
                            VITE_BASE_URL=${{secrets.CLIENT_VITE_BASE_URL}}
                    tags: |
                        ${{secrets.DOCKERHUB_USERNAME}}/chat-app-client:${{github.sha}}
                        ${{secrets.DOCKERHUB_USERNAME}}/chat-app-client:main
            
            - name: Build and push server
              uses: docker/build-push-action@v6
              with: 
                context: ./server
                push: true
                tags: | 
                    ${{secrets.DOCKERHUB_USERNAME}}/chat-app-server:${{github.sha}}
                    ${{secrets.DOCKERHUB_USERNAME}}/chat-app-server:main
     